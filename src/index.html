<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <!-- connect-src 放行:Yahoo(金/美股期货)、OKX REST(币)、qt.gtimg.cn(A股行情) -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self';
                 connect-src https://*.yahoo.com https://query1.finance.yahoo.com https://query2.finance.yahoo.com https://api.gold-api.com https://www.okx.com https://qt.gtimg.cn;
                 style-src 'self' 'unsafe-inline';
                 script-src 'self';">
  <link rel="stylesheet" href="styles.css">
  <title>行情条</title>
</head>
<body>
  <div id="panel">
    <div id="header">
      <span class="hdr-title">行情</span>
      <button id="toggle" class="chevron" title="点击:展开/收起">▴</button>
    </div>
    <div id="list"><!-- 行由 renderer.js 动态生成 --></div>
    <div id="controls">
      <label>透明度 <input type="range" id="opacity" min="5" max="100" step="1" value="85"></label>
      <div id="add-row">
        <input id="add-code" type="text" placeholder="A股 600519 / 名称" maxlength="16" spellcheck="false" autocomplete="off">
        <button id="add-btn" title="添加 A 股标的(股票/指数/ETF)">＋</button>
      </div>
      <div id="add-msg"></div>
    </div>
    <div class="hint">Ctrl+` 交互 · Ctrl+Shift+H 隐藏 · Ctrl+Shift+G 幽灵</div>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
